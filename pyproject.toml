[project]
name = "taichi-academy"
version = "0.1.0"
description = "A lesson-driven series of Taichi GPU-simulation projects — built by the engineer learning how to build it."
requires-python = ">=3.11,<3.12"
dependencies = [
    "taichi>=1.7.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Heavier per-project deps land here as extras when a project needs them, e.g.:
# viz3d = ["open3d>=0.19.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The repo is a curriculum, not an importable package; tools/ scripts are run directly.
packages = []
